replicaCount: 1

image:
  repository: surrealdb/surrealdb
  pullPolicy: IfNotPresent
  # Recommend to replace with a specific version instead of 'latest' for stability
  tag: latest

imagePullSecrets: []

nameOverride: "surrealdb"
fullnameOverride: ""

args: [start]

surrealdb:
  path: pd.database.svc.cluster.local:2379
  log: info
  auth: true
  initial_user: "root"
  initial_pass: "root"
  # For kind locally, use 8080
  port: 8080
  # You can specify a custom service account name here (e.g., gke-surreal-prod, gke-surrealdb-<CLUSTER_NAME>)
  # @see - serviceAccount.serviceAccountName
  serviceAccountName: gke-surrealdb-<REGION>-1

strategy:
  type: RollingUpdate

serviceAccount:
  create: true
  serviceAccountName: gke-surrealdb-<REGION>-1
  annotations: {}

podExtraEnv: []
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
initContainers: []
extraContainers: []

service:
  type: NodePort
  # For kind locally, use 8080
  port: 8080
  selector:
    app: surrealdb
  annotations:
    # Format: cloud.google.com/neg: '{"exposed_ports": {"<PORT>": {"name": "surrealdb-<CLUSTER_NAME>-neg"}}}'
    cloud.google.com/neg: '{"exposed_ports": {"8080": {"name": "surrealdb-<REGION>-1-neg"}}}'

ingress:
  enabled: false

# resources:
#   requests:
#     cpu: 500m
#     memory: 1Gi

lifecycle: {}
terminationGracePeriodSeconds: null

horizontalPodAutoscaler:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  metrics: []

nodeSelector: {}
tolerations: []
affinity: {}
volumes: []
volumeMounts: []

persistence:
  enabled: false

livenessProbe:
  httpGet:
    path: /health
    port: http
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /ready
    port: http
  timeoutSeconds: 5
