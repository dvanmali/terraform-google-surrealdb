{{- if and (eq .Values.enable_prometheus "managed") .Values.monitoring.rules.enabled (or .Values.monitoring.rules.pd .Values.monitoring.rules.tikv .Values.monitoring.rules.nodeExporter .Values.monitoring.rules.blackbox .Values.monitoring.rules.surrealdb) }}
apiVersion: monitoring.googleapis.com/v1
kind: Rules
metadata:
  name: sdb-datastore-alerts
spec:
  groups:
    {{- if .Values.monitoring.rules.pd }}
    - name: pd
      rules:
        - alert: PD_cluster_down_store_nums
          expr: (sum(pd_cluster_status{type="store_down_count"}) by (instance) > 0) and (sum(etcd_server_is_leader) by (instance) > 0)
          labels: { severity: emergency }
        - alert: PD_etcd_write_disk_latency
          expr: histogram_quantile(0.99, sum(rate(etcd_disk_wal_fsync_duration_seconds_bucket[1m])) by (instance, job, le)) > 1
          labels: { severity: critical }
        - alert: PD_miss_peer_region_count
          expr: (sum(pd_regions_status{type="miss-peer-region-count"}) by (instance) > 100) and (sum(etcd_server_is_leader) by (instance) > 0)
          labels: { severity: critical }
        - alert: PD_cluster_lost_connect_store_nums
          expr: (sum(pd_cluster_status{type="store_disconnected_count"}) by (instance) > 0) and (sum(etcd_server_is_leader) by (instance) > 0)
          labels: { severity: warning }
        - alert: PD_cluster_unhealthy_tikv_nums
          expr: (sum(pd_cluster_status{type="store_unhealth_count"}) by (instance) > 0) and (sum(etcd_server_is_leader) by (instance) > 0)
          labels: { severity: warning }
        - alert: PD_cluster_low_space
          expr: (sum(pd_cluster_status{type="store_low_space_count"}) by (instance) > 0) and (sum(etcd_server_is_leader) by (instance) > 0)
          labels: { severity: warning }
        - alert: PD_etcd_network_peer_latency
          expr: histogram_quantile(0.99, sum(rate(etcd_network_peer_round_trip_time_seconds_bucket[1m])) by (To, instance, job, le)) > 1
          labels: { severity: warning }
        - alert: PD_tidb_handle_requests_duration
          expr: histogram_quantile(0.99, sum(rate(pd_client_request_handle_requests_duration_seconds_bucket{type="tso"}[1m])) by (instance, job, le)) > 0.1
          labels: { severity: warning }
        - alert: PD_down_peer_region_nums
          expr: (sum(pd_regions_status{type="down-peer-region-count"}) by (instance) > 0) and (sum(etcd_server_is_leader) by (instance) > 0)
          labels: { severity: warning }
        - alert: PD_pending_peer_region_count
          expr: (sum(pd_regions_status{type="pending-peer-region-count"}) by (instance) > 100) and (sum(etcd_server_is_leader) by (instance) > 0)
          labels: { severity: warning }
        - alert: PD_leader_change
          expr: count(changes(pd_tso_events{type="save"}[10m]) > 0) >= 2
          labels: { severity: warning }
        - alert: TiKV_space_used_more_than_80%
          expr: sum(pd_cluster_status{type="storage_size"}) / sum(pd_cluster_status{type="storage_capacity"}) * 100 > 80
          labels: { severity: warning }
        - alert: PD_system_time_slow
          expr: changes(pd_tso_events{type="system_time_slow"}[10m]) >= 1
          labels: { severity: warning }
        - alert: PD_no_store_for_making_replica
          expr: increase(pd_checker_event_count{type="replica_checker", name="no_target_store"}[1m]) > 0
          labels: { severity: warning }
        - alert: PD_cluster_slow_tikv_nums
          expr: (sum(pd_cluster_status{type="store_slow_count"}) by (instance) > 0) and (sum(etcd_server_is_leader) by (instance) > 0)
          labels: { severity: warning }
    {{- end }}
    {{- if .Values.monitoring.rules.tikv }}
    - name: tikv
      rules:
        - alert: TiKV_memory_used_too_fast
          expr: process_resident_memory_bytes{job=~"tikv", instance=~".*"} - (process_resident_memory_bytes{job=~"tikv",instance=~".*"} offset 5m) > 5*1024*1024*1024
          labels: { severity: emergency }
        - alert: TiKV_GC_can_not_work
          expr: sum(increase(tikv_gcworker_gc_tasks_vec{task="gc"}[1d])) < 1 and (sum(increase(tikv_gc_compaction_filter_perform[1d])) < 1 and sum(increase(tikv_engine_event_total{db="kv", cf="write", type="compaction"}[1d])) >= 1)
          labels: { severity: emergency }
        - alert: TiKV_server_report_failure_msg_total
          expr: sum(rate(tikv_server_report_failure_msg_total{type="unreachable"}[10m])) BY (store_id) > 10
          labels: { severity: critical }
        - alert: TiKV_channel_full_total
          expr: sum(rate(tikv_channel_full_total[10m])) BY (type, instance) > 0
          labels: { severity: critical }
        - alert: TiKV_write_stall
          expr: delta(tikv_engine_write_stall[10m]) > 0
          labels: { severity: critical }
        - alert: TiKV_raft_log_lag
          expr: histogram_quantile(0.99, sum(rate(tikv_raftstore_log_lag_bucket[1m])) by (le, instance)) > 5000
          labels: { severity: critical }
        - alert: TiKV_async_request_snapshot_duration_seconds
          expr: histogram_quantile(0.99, sum(rate(tikv_storage_engine_async_request_duration_seconds_bucket{type="snapshot"}[1m])) by (le, instance, type)) > 1
          labels: { severity: critical }
        - alert: TiKV_async_request_write_duration_seconds
          expr: histogram_quantile(0.99, sum(rate(tikv_storage_engine_async_request_duration_seconds_bucket{type="write"}[1m])) by (le, instance, type)) > 1
          labels: { severity: critical }
        - alert: TiKV_coprocessor_request_wait_seconds
          expr: histogram_quantile(0.9999, sum(rate(tikv_coprocessor_request_wait_seconds_bucket[1m])) by (le, instance, req)) > 10
          labels: { severity: critical }
        - alert: TiKV_raftstore_thread_cpu_seconds_total
          expr: sum(rate(tikv_thread_cpu_seconds_total{name=~"raftstore_.*"}[1m])) by (instance) > 1.6
          labels: { severity: critical }
        - alert: TiKV_raft_append_log_duration_secs
          expr: histogram_quantile(0.99, sum(rate(tikv_raftstore_append_log_duration_seconds_bucket[1m])) by (le, instance)) > 1
          labels: { severity: critical }
        - alert: TiKV_raft_apply_log_duration_secs
          expr: histogram_quantile(0.99, sum(rate(tikv_raftstore_apply_log_duration_seconds_bucket[1m])) by (le, instance)) > 1
          labels: { severity: critical }
        - alert: TiKV_scheduler_latch_wait_duration_seconds
          expr: histogram_quantile(0.99, sum(rate(tikv_scheduler_latch_wait_duration_seconds_bucket[1m])) by (le, instance, type)) > 1
          labels: { severity: critical }
        - alert: TiKV_thread_apply_worker_cpu_seconds
          expr: max(rate(tikv_thread_cpu_seconds_total{name=~"apply_.*"}[1m])) by (instance) > 0.9
          labels: { severity: critical }
        - alert: TiKV_leader_drops
          expr: delta(tikv_pd_heartbeat_tick_total{type="leader"}[30s]) < -10
          labels: { severity: warning }
        - alert: TiKV_raft_process_ready_duration_secs
          expr: histogram_quantile(0.999, sum(rate(tikv_raftstore_raft_process_duration_secs_bucket{type="ready"}[1m])) by (le, instance, type)) > 2
          labels: { severity: warning }
        - alert: TiKV_raft_process_tick_duration_secs
          expr: histogram_quantile(0.999, sum(rate(tikv_raftstore_raft_process_duration_secs_bucket{type="tick"}[1m])) by (le, instance, type)) > 2
          labels: { severity: warning }
        - alert: TiKV_scheduler_context_total
          expr: abs(delta(tikv_scheduler_context_total[5m])) > 1000
          labels: { severity: warning }
        - alert: TiKV_scheduler_command_duration_seconds
          expr: histogram_quantile(0.99, sum(rate(tikv_scheduler_command_duration_seconds_bucket[1m])) by (le, instance, type)) > 1
          labels: { severity: warning }
        - alert: TiKV_coprocessor_outdated_request_wait_seconds
          expr: delta(tikv_coprocessor_outdated_request_wait_seconds_count[10m]) > 0
          labels: { severity: warning }
        - alert: TiKV_coprocessor_pending_request
          expr: delta(tikv_coprocessor_pending_request[10m]) > 5000
          labels: { severity: warning }
        - alert: TiKV_batch_request_snapshot_nums
          expr: sum(rate(tikv_thread_cpu_seconds_total{name=~"cop_.*"}[1m])) by (instance) / (count(tikv_thread_cpu_seconds_total{name=~"cop_.*"}) * 0.9) / count(count(tikv_thread_cpu_seconds_total) by (instance)) > 0
          labels: { severity: warning }
        - alert: TiKV_pending_task
          expr: sum(tikv_worker_pending_task_total) BY (instance, name) > 1000
          labels: { severity: warning }
        - alert: TiKV_low_space
          expr: sum(tikv_store_size_bytes{type="available"}) by (instance) / sum(tikv_store_size_bytes{type="capacity"}) by (instance) < 0.2
          labels: { severity: warning }
        - alert: TiKV_approximate_region_size
          expr: histogram_quantile(0.99, sum(rate(tikv_raftstore_region_size_bucket[1m])) by (le)) > 1073741824
          labels: { severity: warning }
    {{- end }}
    {{- if .Values.monitoring.rules.surrealdb }}
    - name: surrealdb
      rules:
        - alert: SurrealDB_metrics_missing
          expr: absent(surrealdb_build_info)
          for: 5m
          labels: { severity: critical }
        - alert: SurrealDB_http_error_rate
          expr: sum(rate(surrealdb_http_request_total{outcome="error"}[5m])) / sum(rate(surrealdb_http_request_total[5m])) > 0.05
          for: 10m
          labels: { severity: warning }
        - alert: SurrealDB_statement_error_rate
          expr: sum(rate(surrealdb_statement_total{outcome="error"}[5m])) / sum(rate(surrealdb_statement_total[5m])) > 0.05
          for: 10m
          labels: { severity: warning }
        - alert: SurrealDB_query_error_rate
          expr: sum(rate(surrealdb_query_total{outcome="error"}[5m])) / sum(rate(surrealdb_query_total[5m])) > 0.05
          for: 10m
          labels: { severity: warning }
        - alert: SurrealDB_http_request_latency
          expr: histogram_quantile(0.95, sum(rate(surrealdb_http_request_duration_seconds_bucket[5m])) by (le)) > 1
          for: 10m
          labels: { severity: warning }
        - alert: SurrealDB_statement_latency
          expr: histogram_quantile(0.95, sum(rate(surrealdb_statement_duration_seconds_bucket[5m])) by (le)) > 1
          for: 10m
          labels: { severity: warning }
        - alert: SurrealDB_query_latency
          expr: histogram_quantile(0.95, sum(rate(surrealdb_query_duration_seconds_bucket[5m])) by (le)) > 1
          for: 10m
          labels: { severity: warning }
        - alert: SurrealDB_active_sessions_high
          expr: sum(surrealdb_session_active) > 1000
          for: 10m
          labels: { severity: warning }
        - alert: SurrealDB_transaction_conflicts
          expr: sum(rate(surrealdb_transaction_conflicts_total[5m])) > 1
          for: 10m
          labels: { severity: warning }
        - alert: SurrealDB_slow_queries
          expr: sum(rate(surrealdb_slow_query_total[5m])) > 1
          for: 10m
          labels: { severity: warning }
        - alert: SurrealDB_replica_not_normal
          expr: surrealdb_ds_replica_state != 0
          for: 5m
          labels: { severity: critical }
        - alert: SurrealDB_cluster_peers_unresolved
          expr: surrealdb_ds_cluster_peers_unresolved > 0
          for: 5m
          labels: { severity: critical }
        - alert: SurrealDB_consensus_quorum_timeouts
          expr: sum(rate(surrealdb_ds_consensus_fast_quorum_timeouts_total[5m])) > 0
          for: 5m
          labels: { severity: warning }
        - alert: SurrealDB_operation_timeouts
          expr: sum(rate(surrealdb_ds_operation_timeouts_total[5m])) > 0
          for: 5m
          labels: { severity: warning }
        - alert: SurrealDB_recovery_failed
          expr: sum(rate(surrealdb_ds_recovery_completed_total{outcome="failure"}[5m])) > 0
          for: 5m
          labels: { severity: critical }
    {{- end }}
    {{- if .Values.monitoring.rules.nodeExporter }}
    - name: node-exporter
      rules:
        - alert: NODE_disk_used_more_than_80%
          expr: node_filesystem_avail_bytes{fstype=~"(ext.|xfs)", mountpoint!~"/boot"} / node_filesystem_size_bytes{fstype=~"(ext.|xfs)", mountpoint!~"/boot"} * 100 <= 20
          labels: { severity: emergency }
        - alert: NODE_disk_inode_more_than_80%
          expr: node_filesystem_files_free{fstype=~"(ext.|xfs)"} / node_filesystem_files{fstype=~"(ext.|xfs)"} * 100 < 20
          labels: { severity: emergency }
        - alert: NODE_disk_readonly
          expr: node_filesystem_readonly{fstype=~"(ext.|xfs)"} == 1
          labels: { severity: emergency }
        - alert: NODE_memory_used_more_than_80%
          expr: ((node_memory_MemTotal_bytes-node_memory_MemFree_bytes-node_memory_Cached_bytes)/(node_memory_MemTotal_bytes)*100) >= 80
          labels: { severity: critical }
        - alert: NODE_node_overload
          expr: (node_load5 / count without (cpu, mode) (node_cpu_seconds_total{mode="system"})) > 1
          labels: { severity: warning }
        - alert: NODE_cpu_used_more_than_80%
          expr: avg(irate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance) * 100 <= 20
          labels: { severity: warning }
        - alert: NODE_tcp_estab_num_more_than_50000
          expr: node_netstat_Tcp_CurrEstab > 50000
          labels: { severity: warning }
        - alert: NODE_disk_read_latency_more_than_32ms
          expr: ((rate(node_disk_read_time_seconds_total{device=~".+"}[5m]) / rate(node_disk_reads_completed_total{device=~".+"}[5m])) or (irate(node_disk_read_time_seconds_total{device=~".+"}[5m]) / irate(node_disk_reads_completed_total{device=~".+"}[5m]))) * 1000 > 32
          labels: { severity: warning }
        - alert: NODE_disk_write_latency_more_than_16ms
          expr: ((rate(node_disk_write_time_seconds_total{device=~".+"}[5m]) / rate(node_disk_writes_completed_total{device=~".+"}[5m])) or (irate(node_disk_write_time_seconds_total{device=~".+"}[5m]) / irate(node_disk_writes_completed_total{device=~".+"}[5m]))) > 16
          labels: { severity: warning }
    {{- end }}
    {{- if .Values.monitoring.rules.blackbox }}
    - name: blackbox-exporter
      rules:
        - alert: TiFlash_server_is_down
          expr: probe_success{group="tiflash"} == 0
          labels: { severity: emergency }
        - alert: TiKV_server_is_down
          expr: probe_success{group="tikv"} == 0
          labels: { severity: emergency }
        - alert: PD_server_is_down
          expr: probe_success{group="pd"} == 0
          labels: { severity: emergency }
        - alert: Node_exporter_server_is_down
          expr: probe_success{group="node_exporter"} == 0
          labels: { severity: emergency }
        - alert: Blackbox_exporter_server_is_down
          expr: probe_success{group="blackbox_exporter"} == 0
          labels: { severity: emergency }
        - alert: Grafana_server_is_down
          expr: probe_success{group="grafana"} == 0
          labels: { severity: emergency }
        - alert: Pushgateway_server_is_down
          expr: probe_success{group="pushgateway"} == 0
          labels: { severity: emergency }
        - alert: Kafka_exporter_is_down
          expr: probe_success{group="kafka_exporter"} == 0
          labels: { severity: emergency }
        - alert: Pushgateway_metrics_interface
          expr: probe_success{job="blackbox_exporter_http"} == 0
          labels: { severity: emergency }
        - alert: BLACKER_ping_latency_more_than_1s
          expr: max_over_time(probe_duration_seconds{job=~"blackbox_exporter.*_icmp"}[1m]) > 1
          labels: { severity: warning }
  {{- end }}
{{- end }}