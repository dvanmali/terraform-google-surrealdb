{{- if eq .Values.enable_prometheus "managed" }}
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: sdb-datastore-pd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: tidb-operator
      pingcap.com/cluster: sdb-datastore
      pingcap.com/component: pd
  endpoints:
    - port: client
      interval: {{ .Values.monitoring.interval | default "15s" }}
      {{- if .Values.tls.enabled }}
      scheme: https
      tls:
        serverName: pd-pd
        ca:
          secret:
            name: sdb-datastore-cluster-client-secret
            key: ca.crt
        cert:
          secret:
            name: sdb-datastore-cluster-client-secret
            key: tls.crt
        key:
          secret:
            name: sdb-datastore-cluster-client-secret
            key: tls.key
      {{- else }}
      scheme: http
      {{- end }}
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: sdb-datastore-tikv
spec:
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: tidb-operator
      pingcap.com/cluster: sdb-datastore
      pingcap.com/component: tikv
  endpoints:
    - port: status
      path: /metrics
      interval: {{ .Values.monitoring.interval | default "15s" }}
      {{- if .Values.tls.enabled }}
      scheme: https
      tls:
        serverName: tikv-tikv
        ca:
          secret:
            name: sdb-datastore-cluster-client-secret
            key: ca.crt
        cert:
          secret:
            name: sdb-datastore-cluster-client-secret
            key: tls.crt
        key:
          secret:
            name: sdb-datastore-cluster-client-secret
            key: tls.key
      {{- else }}
      scheme: http
      {{- end }}
---
{{- if .Values.monitoring.surrealdb.enabled }}
{{- if .Values.monitoring.surrealdb.secretManager.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: surrealdb-metrics
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.monitoring.surrealdb.secretManager.projectId }}/secrets/{{ .Values.monitoring.surrealdb.secretManager.passwordSecret }}/versions/{{ .Values.monitoring.surrealdb.secretManager.version }}"
        path: "password"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: surrealdb-metrics
spec:
  serviceAccountName: {{ .Values.monitoring.serviceAccount.name }}
  secretProviderClassName: surrealdb-metrics
  secretObject:
    type: Opaque
    data:
      - sourcePath: password
        targetKey: password
{{- end }}
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: surrealdb
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: surrealdb
      app.kubernetes.io/name: surrealdb
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval | default "15s" }}
      basicAuth:
        username: {{ .Values.monitoring.surrealdb.credentials.username }}
        password:
          secret:
            name: {{ .Values.monitoring.surrealdb.credentials.name }}
            key: password
      {{- if .Values.tls.enabled }}
      scheme: https
      tls:
        serverName: surrealdb
        ca:
          secret:
            name: sdb-web-secret
            key: ca.crt
        cert:
          secret:
            name: sdb-web-secret
            key: tls.crt
        key:
          secret:
            name: sdb-web-secret
            key: tls.key
      {{- else }}
      scheme: http
      {{- end }}
{{- end }}
{{- end }}
