tls:
  enabled: true

serviceAccount:
  create: false
  name: tidb-encryption
  annotations: {}

enable_prometheus: disabled
monitoring:
  interval: 15s
  managedPrometheus:
    secretAccess:
      enabled: true
    collectorServiceAccount: collector
    collectorNamespaces:
      - gke-gmp-system
      - gmp-system
  rules:
    enabled: false
    pd: true
    tikv: true
    nodeExporter: false
    blackbox: false
    surrealdb: false
  surrealdb:
    enabled: false
    credentials:
      name: surrealdb-metrics
      username: metrics
    secretManager:
      enabled: false
      projectId: ""
      passwordSecret: surrealdb-metrics-password
      version: latest
  serviceAccount:
    create: false
    name: surrealdb-monitoring
    annotations: {}
